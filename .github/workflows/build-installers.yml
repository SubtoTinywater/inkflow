name: Build and Release Installers

on:
  push:
    tags: ['v*']          # push a tag like v1.0.0 to build AND publish a Release
  workflow_dispatch:       # manual run: builds installers as downloadable artifacts only

permissions:
  contents: write          # required so the release job can create a GitHub Release

jobs:
  mac:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Generate build config with per-arch file names
        shell: bash
        run: |
          cat > make-config.cjs <<'JS'
          const fs = require('fs');
          const b = require('./package.json').build;
          b.mac.artifactName = 'InkFlow-Studio-${version}-mac-${arch}.${ext}';
          b.nsis.artifactName = 'InkFlow-Studio-Setup-${version}-win-${arch}.${ext}';
          fs.writeFileSync('ci-builder.json', JSON.stringify(b, null, 2));
          JS
          node make-config.cjs
      - name: Build .dmg for Intel (x64)
        shell: bash
        run: npx electron-builder --config ci-builder.json --mac dmg --x64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - name: Build .dmg for Apple Silicon (arm64)
        shell: bash
        run: npx electron-builder --config ci-builder.json --mac dmg --arm64 --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: installer-mac, path: inkflow/dist/*.dmg }

  windows:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Generate build config with per-arch file names
        shell: bash
        run: |
          cat > make-config.cjs <<'JS'
          const fs = require('fs');
          const b = require('./package.json').build;
          b.mac.artifactName = 'InkFlow-Studio-${version}-mac-${arch}.${ext}';
          b.nsis.artifactName = 'InkFlow-Studio-Setup-${version}-win-${arch}.${ext}';
          fs.writeFileSync('ci-builder.json', JSON.stringify(b, null, 2));
          JS
          node make-config.cjs
      - name: Build .exe for x64 (Intel/AMD)
        shell: bash
        run: npx electron-builder --config ci-builder.json --win nsis --x64 --publish never
      - name: Build .exe for arm64
        shell: bash
        run: npx electron-builder --config ci-builder.json --win nsis --arm64 --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-windows, path: inkflow/dist/*.exe }

  linux:
    defaults:
      run:
        working-directory: inkflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build Linux AppImages (x64 and arm64)
        run: npx electron-builder --linux AppImage --x64 --arm64 -c.appImage.artifactName='InkFlow-Studio-${version}-linux-${arch}.${ext}' --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-linux, path: inkflow/dist/*.AppImage }

  android:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run android:sync
      - name: Build .apk
        run: npm run android:apk
      - name: Name the APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk InkFlow-Studio.apk
      - uses: actions/upload-artifact@v4
        with: { name: installer-android, path: inkflow/InkFlow-Studio.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')   # only publish when triggered by a version tag
    needs: [mac, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
