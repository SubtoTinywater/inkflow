name: Build and Release Installers

on:
  push:
    tags: ['v*']          # push a tag like v1.0.0 to build AND publish a Release
  workflow_dispatch:       # manual run: builds installers as downloadable artifacts only

permissions:
  contents: write          # required so the release job can create a GitHub Release

jobs:
  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - name: Build .dmg
        run: npx electron-builder --mac dmg --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: installer-mac, path: dist/*.dmg }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm install
      - name: Build .exe installer
        run: npx electron-builder --win nsis --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-windows, path: dist/*.exe }

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run android:sync
      - name: Build .apk
        run: npm run android:apk
      - name: Name the APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk InkFlow-Studio.apk
      - uses: actions/upload-artifact@v4
        with: { name: installer-android, path: InkFlow-Studio.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')   # only publish when triggered by a version tag
    needs: [mac, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
