name: Build and Release Installers

on:
  push:
    tags: ['v*']          # push a tag like v1.0.0 to build AND publish a Release
  workflow_dispatch:       # manual run: builds installers as downloadable artifacts only

permissions:
  contents: write          # required so the release job can create a GitHub Release

jobs:
  mac:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build .dmg (Intel x64 and Apple Silicon arm64, separate files)
        run: npx electron-builder --mac dmg --x64 --arm64 -c.mac.artifactName='InkFlow-Studio-${version}-mac-${arch}.${ext}' --publish never
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
      - uses: actions/upload-artifact@v4
        with: { name: installer-mac, path: inkflow/dist/*.dmg }

  windows:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build .exe installer
        run: npx electron-builder --win nsis --x64 --arm64 -c.nsis.buildUniversalInstaller=false -c.nsis.artifactName='InkFlow-Studio-Setup-${version}-win-${arch}.${ext}' --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-windows, path: inkflow/dist/*.exe }

  linux:
    defaults:
      run:
        working-directory: inkflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm install
      - name: Build Linux AppImages (x64 and arm64)
        run: npx electron-builder --linux AppImage --x64 --arm64 -c.appImage.artifactName='InkFlow-Studio-${version}-linux-${arch}.${ext}' --publish never
      - uses: actions/upload-artifact@v4
        with: { name: installer-linux, path: inkflow/dist/*.AppImage }

  android:
    defaults:
      run:
        working-directory: inkflow   # your repo keeps the app inside the inkflow/ folder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run android:sync
      - name: Build .apk
        run: npm run android:apk
      - name: Name the APK
        run: mv android/app/build/outputs/apk/debug/app-debug.apk InkFlow-Studio.apk
      - uses: actions/upload-artifact@v4
        with: { name: installer-android, path: inkflow/InkFlow-Studio.apk }

  release:
    if: startsWith(github.ref, 'refs/tags/v')   # only publish when triggered by a version tag
    needs: [mac, windows, linux, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: installers, merge-multiple: true }
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
